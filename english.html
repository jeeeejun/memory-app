      - 내 오답: 맞힌 문제는 "" / 틀린 문제는 내가 쓴 답 / "?" 는 선생님 체크(다시 볼 문제)

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#0f172a;color:#e2e8f0;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;max-width:760px;margin:0 auto}
.top h1{font-size:20px;margin:0}
.top a{color:#facc15;font-size:13px;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:0 14px}
h2{font-size:16px;margin:22px 0 8px}
.muted{color:#94a3b8;font-size:13px;line-height:1.5}
.hidden{display:none!important}
.center{text-align:center}
.tab{display:none}.tab.active{display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
select,input[type=text],textarea{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:10px;font-size:16px}
textarea{width:100%;font-family:ui-monospace,monospace;font-size:13px}
.chk{display:flex;align-items:center;gap:4px;font-size:14px}
.btn{background:#334155;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer}
.btn.small{padding:8px 12px;font-size:14px}
.btn.good{background:#16a34a}.btn.bad{background:#dc2626}.btn.mid{background:#ca8a04}
.btn.wide{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:#1e293b;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:#94a3b8}
.stat.r b{color:#f87171}.stat.y b{color:#facc15}.stat.g b{color:#4ade80}
.qcard{background:#1e293b;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:260px}
.qmeta{display:flex;justify-content:space-between;color:#94a3b8;font-size:13px;gap:8px}
.tagc{background:#334155;border-radius:8px;padding:1px 8px;font-size:12px;color:#e2e8f0}
.sent{font-size:19px;line-height:1.65;font-family:Georgia,"Times New Roman",serif}
.blank{display:inline-block;border-bottom:2px solid #facc15;color:#facc15;font-weight:700;padding:0 4px;min-width:70px;text-align:center}
.blank.ok{color:#4ade80;border-color:#4ade80}.blank.no{color:#f87171;border-color:#f87171}
.ansrow{display:flex;gap:8px}
.ansrow input{flex:1;min-width:0;font-size:20px;font-family:Georgia,serif}
.ansrow .btn{white-space:nowrap}
.result{border-top:1px dashed #475569;padding-top:12px;line-height:1.6;font-size:15px}
.result .big{font-size:20px;font-weight:700}
.result .ok{color:#4ade80}.result .no{color:#f87171}
.result s{color:#f87171}
.why{color:#cbd5e1;margin-top:6px}
.prev{font-size:13px;color:#94a3b8}
.speak{background:none;border:1px solid #334155;color:#e2e8f0;border-radius:999px;width:36px;height:36px;font-size:15px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip.on{background:#facc15;color:#111;border-color:#facc15;font-weight:700}
.chip .n{color:#f87171;font-weight:700;margin-left:3px}
.chip.on .n{color:#b91c1c}
.passage{background:#1e293b;border-radius:14px;padding:16px;font-family:Georgia,serif;font-size:17px;line-height:2.1}
.passage input{width:auto;min-width:90px;max-width:170px;padding:2px 6px;font-size:16px;border-radius:6px;font-family:Georgia,serif}
.passage input.ok{border-color:#4ade80;color:#4ade80}.passage input.no{border-color:#f87171;color:#f87171}
.passage .fix{color:#4ade80;font-size:13px;margin-left:2px}
.passage .base{color:#94a3b8;font-size:12px}
.note{background:#1e293b;border-radius:12px;padding:12px 14px;margin:10px 0;border-left:4px solid #f87171}
.note.done{border-left-color:#4ade80;opacity:.75}
.note .h{display:flex;justify-content:space-between;font-size:12px;color:#94a3b8}
.note .s{font-family:Georgia,serif;font-size:15px;line-height:1.6;margin:6px 0}
.note .a{font-size:15px}
.note .a s{color:#f87171}.note .a b{color:#4ade80}
.pat{display:flex;flex-wrap:wrap;gap:6px}
.pat div{background:#1e293b;border-radius:10px;padding:8px 12px;font-size:14px}
.pat b{color:#f87171}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#020617;border-top:1px solid #1e293b;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;background:none;border:0;color:#94a3b8;padding:14px 0;font-size:14px;cursor:pointer}
.tabs button.active{color:#facc15;font-weight:700}
.empty{text-align:center;padding:40px 10px;color:#94a3b8}
@media print{
  body{background:#fff;color:#000;padding:0}
  .top,.tabs,.noprint,.row{display:none!important}
  .tab{display:none!important}#tab-note{display:block!important}
  .note{background:#fff;border:1px solid #999;border-left:4px solid #000;break-inside:avoid;opacity:1}
  .note .h,.why{color:#333}.note .a s{color:#b00}.note .a b{color:#060}
  .pat div{background:#fff;border:1px solid #999}
}
/* 아이폰 두 번 탭 확대 막기 */
html,body,button,a{touch-action:manipulation}
select,textarea,input{font-size:max(16px,1em)}

<body>
<header class="top">
  <h1>📝 영어 복습</h1>
  <div><a href="index.html">← 암기장</a> · <a href="vocab.html">단어장</a></div>
</header>

<main>
  <!-- 오답 복습 -->
  <section id="tab-drill" class="tab active">
    <div class="stats">
      <div class="stat r"><b id="stWrong">0</b><span>복습할 오답</span></div>
      <div class="stat y"><b id="stTry">0</b><span>오늘 푼 문제</span></div>
      <div class="stat g"><b id="stDone">0</b><span>극복한 오답</span></div>
    </div>
    <div class="row">
      <select id="dScope">
        <option value="wrong">틀린 문제만</option>
        <option value="mix">틀린 문제 + 섞어서 맞힌 문제</option>
        <option value="all">전체 문제</option>
      </select>
      <select id="dLesson"></select>
      <select id="dMode">
        <option value="type">직접 쓰기</option>
        <option value="card">카드 (보고 넘기기)</option>
      </select>
      <button class="btn small" id="dRestart">↻ 다시 시작</button>
    </div>
    <div id="drillBox"></div>
    <p class="muted">틀리면 3문제 뒤에 다시 나와요. 한 문제를 <b>3번 연속</b> 맞히면 '극복'으로 빠져요. 틀린 기록은 오답노트에 남아요.</p>
  </section>

  <!-- 지문 -->
  <section id="tab-passage" class="tab">
    <p class="muted">학습지처럼 지문 전체를 다시 풀어요. 숫자는 그 지문에서 아직 극복 못 한 오답 수예요.</p>
    <div class="chips" id="pChips"></div>
    <div id="passageBox"></div>
  </section>

  <!-- 오답노트 -->
  <section id="tab-note" class="tab">
    <h2>내 실수 패턴</h2>
    <div class="pat" id="patBox"></div>
    <div class="row noprint">
      <select id="nFilter">
        <option value="open">아직 복습할 오답</option>
        <option value="all">틀렸던 문제 전부</option>
      </select>
      <button class="btn small good" id="nPrint">오답노트 PDF 저장</button>
    </div>
    <div id="noteList"></div>
  </section>

  <!-- 추가 -->
  <section id="tab-add" class="tab">
    <h2>새 학습지 추가</h2>
    <p class="muted">채점한 어형변화 학습지 사진과 아래 요청문을 AI에게 보내고, 받은 JSON을 붙여넣으세요. 이 기기에만 저장돼요.</p>
    <textarea id="promptBox" rows="9" readonly></textarea>
    <div class="row"><button class="btn small" id="copyPrompt">요청문 복사</button></div>
    <textarea id="pasteBox" rows="8" placeholder='[{"id":"9-1","book":"빠바 구문독해","lesson":"9과","no":1,"title":"...","text":["... [01] ..."],"b":[["limit","limited","limit","분사","해설"]]}]'></textarea>
    <div class="row"><button class="btn" id="pasteAdd">추가하기</button></div>
    <p class="muted" id="pasteMsg"></p>
    <h2>기기에 추가한 지문</h2>
    <div id="extraList" class="muted"></div>
    <h2>기록</h2>
    <div class="row">
      <button class="btn small" id="exportBtn">기록 내보내기</button>
      <label class="btn small">가져오기<input type="file" id="importFile" accept=".json,application/json" hidden></label>
      <button class="btn small bad" id="resetBtn">기록 초기화</button>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="drill" class="active">오답 복습</button>
  <button data-tab="passage">지문 다시 풀기</button>
  <button data-tab="note">오답노트</button>
  <button data-tab="add">추가</button>
</nav>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KEY = 'eng_review_v1', XKEY = 'eng_review_extra';
const MASTER = 3; // 연속으로 이만큼 맞히면 극복
let store = { st: {}, day: '', today: 0 };
try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.st) store = Object.assign(store, v); } catch (e) {}
let extra = [];
try { extra = JSON.parse(localStorage.getItem(XKEY)) || []; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const todayStr = () => new Date().toISOString().slice(0, 10);

/* ===== 데이터 ===== */
let passages = [], items = [];
function build() {
  const base = JSON.parse($('eng-data').textContent);
  const map = {}; base.forEach(p => map[p.id] = p); extra.forEach(p => map[p.id] = p);
  passages = Object.values(map).sort((a, b) => cmpId(a.id, b.id));
  items = [];
  passages.forEach(p => p.b.forEach((b, i) => {
    const n = String(i + 1).padStart(2, '0');
    items.push({ id: `${p.id}-${n}`, p, n, base: b[0], ans: String(b[1]).split('|').map(s => s.trim()), my: b[2] || '', tag: b[3] || '', why: b[4] || '' });
  }));
}
function cmpId(a, b) { const x = a.split('-').map(Number), y = b.split('-').map(Number); return (x[0] - y[0]) || (x[1] - y[1]) || a.localeCompare(b); }
const rec = it => store.st[it.id] || { w: 0, c: 0, n: 0 };
const everWrong = it => !!it.my || rec(it).w > 0;
const mastered = it => rec(it).c >= MASTER;
const open = it => everWrong(it) && !mastered(it);
const norm = s => String(s).toLowerCase().replace(/[’']/g, "'").replace(/[.,!?;:"]/g, '').replace(/\s+/g, ' ').trim();
const isRight = (it, v) => it.ans.some(a => norm(a) === norm(v));
const myLabel = it => it.my === '?' ? '선생님 체크' : it.my;

function record(it, ok) {
  if (store.day !== todayStr()) { store.day = todayStr(); store.today = 0; }
  const r = rec(it);
  r.n++; r.t = Date.now();
  if (ok) r.c++; else { r.w++; r.c = 0; }
  store.st[it.id] = r; store.today++; save(); renderStats();
}
function renderStats() {
  if (store.day !== todayStr()) { store.day = todayStr(); store.today = 0; }
  $('stWrong').textContent = items.filter(open).length;
  $('stTry').textContent = store.today;
  $('stDone').textContent = items.filter(it => everWrong(it) && mastered(it)).length;
}

/* 문장: target 빈칸은 html로, 나머지 빈칸은 정답으로 채움 */
function sentenceOf(it) { return it.p.text.find(s => s.includes(`[${it.n}]`)) || ''; }
function fillSentence(s, p, targetN, targetHtml) {
  return esc(s).replace(/\[(\d\d)\]/g, (m, n) => n === targetN ? targetHtml : esc(p.b[+n - 1] ? String(p.b[+n - 1][1]).split('|')[0] : m));
}
function plainSentence(it) { return sentenceOf(it).replace(/\[(\d\d)\]/g, (m, n) => String(it.p.b[+n - 1][1]).split('|')[0]); }
function speak(text) {
  try { const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ===== 오답 복습 ===== */
let queue = [], qi = 0, answered = false, sessionOk = 0, sessionN = 0;
function fillLessonSelect() {
  const sel = $('dLesson'), cur = sel.value;
  const lessons = [...new Set(passages.map(p => p.lesson))];
  sel.innerHTML = '<option value="*">모든 과</option>' + lessons.map(l => `<option>${esc(l)}</option>`).join('');
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}
function startDrill() {
  const lesson = $('dLesson').value, scope = $('dScope').value;
  let pool = items.filter(it => lesson === '*' || it.p.lesson === lesson);
  if (scope === 'wrong') pool = shuffle(pool.filter(open)).sort((a, b) => rec(b).w - rec(a).w);
  else if (scope === 'mix') {
    const w = shuffle(pool.filter(open)), r = shuffle(pool.filter(it => !open(it))).slice(0, Math.max(5, Math.round(w.length / 2)));
    pool = shuffle([...w, ...r]);
  } else pool = shuffle(pool);
  queue = pool; qi = 0; sessionOk = 0; sessionN = 0;
  drawDrill();
}
function drawDrill() {
  const box = $('drillBox'); answered = false;
  if (!queue.length) {
    box.innerHTML = `<div class="qcard"><div class="empty">🎉 복습할 오답이 없어요!<br>'전체 문제'로 바꾸거나 '지문 다시 풀기'로 확인해 보세요.</div></div>`; return;
  }
  if (qi >= queue.length) {
    box.innerHTML = `<div class="qcard"><div class="empty"><div style="font-size:40px">✅</div>한 바퀴 끝! ${sessionN}번 풀어서 ${sessionOk}번 맞혔어요.<br><br><button class="btn good" id="again">한 번 더</button></div></div>`;
    $('again').onclick = startDrill; return;
  }
  const it = queue[qi], card = $('dMode').value === 'card', r = rec(it);
  const blank = `<span class="blank" id="bl">( ${esc(it.base)} )</span>`;
  box.innerHTML = `<div class="qcard">
    <div class="qmeta"><span>${esc(it.p.lesson)} ${it.p.no}번 · ${esc(it.p.title)} · (${it.n})</span><span>${qi + 1} / ${queue.length}</span></div>
    <div class="sent">${fillSentence(sentenceOf(it), it.p, it.n, blank)}</div>
    ${card ? `<div class="muted center" id="tapHint">( ${esc(it.base)} ) 를 알맞은 형태로 떠올리고 → 답 보기</div>
      <button class="btn" id="reveal">답 보기</button>`
    : `<div class="ansrow"><input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(it.base)} → ?"><button class="btn good" id="chk">확인</button></div>
      <div class="row" style="margin:0"><button class="btn small" id="hint">💡 힌트</button><span class="muted" id="hintTxt"></span></div>`}
    <div class="result hidden" id="res"></div>
    <div class="row hidden" id="nextRow" style="margin:0"></div>
    <div class="prev">${r.n ? `지금까지 ${r.n}번 풀이 · 틀림 ${r.w + (it.my && it.my !== '?' ? 1 : 0)} · 연속 정답 ${r.c}/${MASTER}` : (it.my ? '학습지에서 틀린 문제' : '')}</div>
  </div>`;
  if (card) {
    $('reveal').onclick = () => { showResult(it, null); $('reveal').remove(); $('tapHint').remove(); };
  } else {
    const inp = $('ans');
    inp.focus();
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); answered ? next() : check(); } };
    $('chk').onclick = () => answered ? next() : check();
    $('hint').onclick = () => { $('hintTxt').textContent = `유형: ${it.tag || '?'} · 첫 글자 ${it.ans[0][0]} · ${it.ans[0].length}글자`; };
  }
}
function check() {
  const it = queue[qi], v = $('ans').value;
  if (!v.trim()) return;
  const ok = isRight(it, v);
  record(it, ok); sessionN++; if (ok) sessionOk++;
  if (!ok) requeue(it);
  showResult(it, ok, v);
}
function requeue(it) {
  const pos = Math.min(queue.length, qi + 4);
  queue.splice(pos, 0, it);
}
function showResult(it, ok, v) {
  answered = true;
  const bl = $('bl');
  bl.textContent = it.ans[0]; bl.classList.add(ok === false ? 'no' : 'ok');
  const prev = it.my ? `<div class="prev">학습지에서: ${it.my === '?' ? '선생님이 체크한 문제' : `<s>${esc(it.my)}</s> → ${esc(it.ans[0])}`}</div>` : '';
  const head = ok === null ? `<span class="big">${esc(it.ans.join(' / '))}</span>`
    : ok ? `<span class="big ok">⭕ 정답! ${esc(it.ans[0])}</span>`
    : `<span class="big no">❌ <s>${esc(v)}</s> → ${esc(it.ans[0])}</span>`;
  $('res').innerHTML = `${head} <button class="speak" id="spk" title="문장 듣기">🔊</button>
    <div class="why"><span class="tagc">${esc(it.tag)}</span> ${esc(it.why)}</div>${prev}`;
  $('res').classList.remove('hidden');
  $('spk').onclick = () => speak(plainSentence(it));
  const nr = $('nextRow'); nr.classList.remove('hidden');
  if (ok === null) {
    nr.innerHTML = `<button class="btn bad wide" id="cNo">몰랐다</button><button class="btn good wide" id="cOk">알았다</button>`;
    $('cNo').onclick = () => { record(it, false); sessionN++; requeue(it); next(); };
    $('cOk').onclick = () => { record(it, true); sessionN++; sessionOk++; next(); };
  } else {
    nr.innerHTML = `<button class="btn wide" id="nxt">다음 →</button>`;
    $('nxt').onclick = next;
    $('chk').textContent = '다음';
    $('ans').readOnly = true;
  }
}
function next() { qi++; drawDrill(); }

/* ===== 지문 다시 풀기 ===== */
let curP = null;
function renderPassageChips() {
  $('pChips').innerHTML = passages.map(p => {
    const n = items.filter(it => it.p === p && open(it)).length;
    return `<button class="chip ${curP === p.id ? 'on' : ''}" data-id="${esc(p.id)}">${esc(p.lesson)} ${p.no}번${n ? `<span class="n">${n}</span>` : ''}</button>`;
  }).join('');
  $('pChips').querySelectorAll('.chip').forEach(b => b.onclick = () => { curP = b.dataset.id; renderPassageChips(); renderPassage(); });
}
function renderPassage() {
  const p = passages.find(x => x.id === curP), box = $('passageBox');
  if (!p) { box.innerHTML = '<div class="empty">위에서 지문을 고르세요.</div>'; return; }
  box.innerHTML = `<h2>${esc(p.lesson)} ${p.no}번 · ${esc(p.title)}</h2>
    <div class="passage">${p.text.map(s => esc(s).replace(/\[(\d\d)\]/g, (m, n) => {
      const it = items.find(x => x.p === p && x.n === n);
      return `<span class="base">(${n})</span><input type="text" data-n="${n}" placeholder="${esc(it.base)}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" size="${Math.max(6, it.base.length + 2)}">`;
    })).join(' ')}</div>
    <div class="row"><button class="btn good" id="pGrade">채점하기</button><button class="btn small" id="pClear">지우기</button><button class="btn small" id="pSpeak">🔊 지문 듣기</button></div>
    <div id="pRes"></div>`;
  $('pGrade').onclick = () => gradePassage(p);
  $('pClear').onclick = renderPassage;
  $('pSpeak').onclick = () => speak(p.text.map(s => s.replace(/\[(\d\d)\]/g, (m, n) => String(p.b[+n - 1][1]).split('|')[0])).join(' '));
}
function gradePassage(p) {
  let ok = 0, n = 0; const wrong = [];
  $('passageBox').querySelectorAll('input[data-n]').forEach(inp => {
    const it = items.find(x => x.p === p && x.n === inp.dataset.n);
    const v = inp.value; n++;
    inp.classList.remove('ok', 'no');
    inp.nextElementSibling?.classList.contains('fix') && inp.nextElementSibling.remove();
    const right = v.trim() && isRight(it, v);
    inp.classList.add(right ? 'ok' : 'no');
    if (right) ok++; else { wrong.push({ it, v }); inp.insertAdjacentHTML('afterend', `<span class="fix">${esc(it.ans[0])}</span>`); }
    if (v.trim()) record(it, !!right); // 빈칸은 기록하지 않음
  });
  $('pRes').innerHTML = `<p><b>${ok} / ${n}</b> 맞음</p>` + wrong.map(({ it, v }) =>
    `<div class="note"><div class="a">(${it.n}) ${esc(it.base)} : ${v.trim() ? `<s>${esc(v)}</s>` : '(빈칸)'} → <b>${esc(it.ans[0])}</b></div><div class="why"><span class="tagc">${esc(it.tag)}</span> ${esc(it.why)}</div></div>`).join('');
  renderPassageChips();
}

/* ===== 오답노트 ===== */
function renderNote() {
  const all = items.filter(everWrong);
  const list = $('nFilter').value === 'open' ? all.filter(open) : all;
  const pat = {};
  all.forEach(it => { pat[it.tag] = (pat[it.tag] || 0) + 1 + rec(it).w; });
  const tips = { '복수형': 'many·셀 수 있는 명사 → -s 확인, a 뒤면 단수', '분사': '감정을 주면 -ing, 느끼면 -ed', '명사': '관사·소유격·전치사 뒤 = 명사', '형용사': '명사 앞·be동사 뒤 = 형용사', '부사': '동사·형용사·문장 꾸밈 = 부사' };
  $('patBox').innerHTML = Object.entries(pat).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<div><b>${esc(t)}</b> ${n}회 · <span class="muted">${esc(tips[t] || '')}</span></div>`).join('') || '<div class="muted">아직 틀린 기록이 없어요</div>';
  $('noteList').innerHTML = list.map(it => {
    const r = rec(it);
    return `<div class="note ${mastered(it) ? 'done' : ''}">
      <div class="h"><span>${esc(it.p.lesson)} ${it.p.no}번 · ${esc(it.p.title)} · (${it.n})</span><span>${mastered(it) ? '극복 ✓' : `연속 ${r.c}/${MASTER}`} · 틀림 ${r.w + (it.my && it.my !== '?' ? 1 : 0)}</span></div>
      <div class="s">${fillSentence(sentenceOf(it), it.p, it.n, `<span class="blank">${esc(it.ans[0])}</span>`)}</div>
      <div class="a">${esc(it.base)} → ${it.my && it.my !== '?' ? `<s>${esc(it.my)}</s> ` : ''}<b>${esc(it.ans.join(' / '))}</b>${it.my === '?' ? ' <span class="muted">(선생님 체크)</span>' : ''}</div>
      <div class="why"><span class="tagc">${esc(it.tag)}</span> ${esc(it.why)}</div>
    </div>`;
  }).join('') || '<div class="empty">복습할 오답이 없어요 🎉</div>';
}

/* ===== 추가 ===== */
const PROMPT = `첨부한 영어 '어형변화' 학습지 사진을 아래 JSON 배열 형식으로 바꿔줘. 지문 하나가 객체 하나야. JSON만 출력해.
[{"id":"9-1","book":"빠바 구문독해","lesson":"9과","no":1,"title":"지문 한 줄 제목(한국어)",
 "text":["원문 문장을 한 문장씩. 빈칸은 [01], [02] 처럼 번호로"],
 "b":[["괄호 안 원형","정답(여러 개 허용이면 a|b)","내가 쓴 오답(맞았으면 빈 문자열, 선생님 체크만 있으면 ?)","명사|형용사|부사|분사|복수형 중 하나","왜 그 형태인지 한 줄 해설(한국어)"]]}]
- id는 "과-번호"(예: 9-1). b 배열 순서 = 빈칸 번호 순서.
- 사진의 손글씨 답과 빨간 펜 고친 답을 보고 내가 틀린 문제를 정확히 표시해줘. 채점 표시가 없어도 문법상 틀린 답이면 오답으로.`;
function renderExtra() {
  $('extraList').innerHTML = extra.length ? extra.map(p => `<div class="row" style="margin:4px 0">${esc(p.lesson)} ${p.no}번 · ${esc(p.title)} <button class="btn small bad" data-del="${esc(p.id)}">삭제</button></div>`).join('') : '없음';
  $('extraList').querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('이 지문을 지울까요?')) return;
    extra = extra.filter(p => p.id !== b.dataset.del); localStorage.setItem(XKEY, JSON.stringify(extra)); refreshAll();
  });
}
$('promptBox').value = PROMPT;
$('copyPrompt').onclick = () => { navigator.clipboard?.writeText(PROMPT); $('copyPrompt').textContent = '복사됨 ✓'; };
$('pasteAdd').onclick = () => {
  try {
    let t = $('pasteBox').value.trim().replace(/^```(json)?/, '').replace(/```$/, '');
    let arr = JSON.parse(t); if (!Array.isArray(arr)) arr = [arr];
    arr.forEach(p => { if (!p.id || !Array.isArray(p.text) || !Array.isArray(p.b)) throw new Error('id/text/b가 없는 지문이 있어요'); });
    arr.forEach(p => { extra = extra.filter(x => x.id !== p.id); extra.push(p); });
    localStorage.setItem(XKEY, JSON.stringify(extra));
    $('pasteMsg').textContent = `${arr.length}개 지문을 추가했어요.`; $('pasteBox').value = '';
    refreshAll();
  } catch (e) { $('pasteMsg').textContent = '형식 오류: ' + e.message; }
};
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ store, extra })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `영어복습-${todayStr()}.json`; a.click();
};
$('importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    const d = JSON.parse(t);
    if (d.store) { store = Object.assign({ st: {} }, d.store); save(); }
    if (Array.isArray(d.extra)) { extra = d.extra; localStorage.setItem(XKEY, JSON.stringify(extra)); }
    refreshAll(); alert('가져왔어요');
  }).catch(() => alert('파일을 읽지 못했어요'));
};
$('resetBtn').onclick = () => { if (confirm('풀이 기록을 모두 지울까요? (학습지 오답 표시는 남아요)')) { store = { st: {}, day: '', today: 0 }; save(); refreshAll(); } };

/* ===== 탭 ===== */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + b.dataset.tab));
  if (b.dataset.tab === 'passage') { renderPassageChips(); renderPassage(); }
  if (b.dataset.tab === 'note') renderNote();
  if (b.dataset.tab === 'add') renderExtra();
  if (b.dataset.tab === 'drill') renderStats();
  window.scrollTo(0, 0);
});
['dScope', 'dLesson', 'dMode'].forEach(id => $(id).onchange = startDrill);
$('dRestart').onclick = startDrill;
$('nFilter').onchange = renderNote;
$('nPrint').onclick = () => { renderNote(); window.print(); };

function refreshAll() { build(); fillLessonSelect(); renderStats(); startDrill(); renderPassageChips(); renderPassage(); renderNote(); renderExtra(); }
refreshAll();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
