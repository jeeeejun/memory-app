<!--
=====================================================================
  모고 지문 암기 (마인드맵 · 흐름) — AI 수정 가이드
=====================================================================
  한 파일짜리 페이지. 그림은 mindmap.js + mindmap.css 부품을 쓴다(색은 아래 .mm 변수).
  내용은 아래 <script type="application/json" id="mogo-data"> 의 JSON 배열. 직접 고치지 말고
  tools/mogo_oct26.py 의 P(...) 목록을 고친 뒤 `python3 tools/mogo_oct26.py` 로 다시 채운다.
  지문 하나 = 객체 하나:
  { "id":"20",                    ← 지문 번호 (단어장 @모고 #번호와 같게). 바꾸면 그 지문의 기록이 사라짐
    "label":"20번",               ← (선택) 칩에 보일 이름. 없으면 "id번"
    "type":"필자의 주장", "topic":"한 줄 주제", "answer":"③",
    "map": { "center":"가운데 주제",
             "branches":[ { "label":"가지 이름",
                            "items":[ {"ko":"핵심 내용", "en":"지문 속 핵심 표현"} ] } ] },   ← 가지 3~5개, 잎 2~4개
    "flow":[ {"tag":"도입", "ko":"이 단계 내용 한 줄", "en":"그 단계의 신호 표현"} ],          ← 글이 흘러가는 순서대로 4~6단계
    "summary":"한국어 요약",
    "note":"풀이 메모(어법·어휘 정답 이유, 순서·삽입 단서)" }   ← (선택) '전체 보기'에서만 보임
  - 지문 원문 전체를 옮기지 않는다. 내 말로 정리한 구조 + 짧은 핵심 표현(en)만.
  - en 은 시험지 원문에 실제로 있는 표현만. 가능하면 단어장에 있는 표현을 쓴다.
  - "sample": true 인 지문은 모양 확인용 예시다. 모고 지문을 넣으면 지운다.
  저장 키: localStorage "mogo_oct26_study_v1"
     { miss:{지문id:[노드키]}, done:{"지문id:map"|"지문id:flow":true}, best:{지문id:틀린 횟수}, cur, mapMode, flowMode, hint }
=====================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --paper:#f7f6f1; --card:#fffefa; --ink:#23262e; --muted:#6b6f7a; --rule:#dfe3ea;
  --line:#c9cfdb; --gold:#b08a2e; --red:#c2463d; --blue:#2f5fa8; --green:#3f7d4e;
  --chip:#eceae2; --shadow:0 1px 0 rgba(35,38,46,.06),0 6px 18px rgba(35,38,46,.07);
  --serif:"Gowun Batang",Georgia,"Apple SD Gothic Neo",serif;
  --sans:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#17191e; --card:#1f2228; --ink:#e8e6df; --muted:#9a9ea8; --rule:#2c3038;
  --line:#3a3f49; --gold:#d4ab4c; --red:#e27367; --blue:#7fa6e6; --green:#78b487;
  --chip:#2a2d34; --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35); --mm-lum:64%; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body,button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--serif);font-size:1.7rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:14px}
.toplinks{display:flex;gap:6px;margin-bottom:8px}
.toplinks a{background:#0f172a;color:#facc15;padding:6px 10px;border-radius:10px;font:13px -apple-system,sans-serif;text-decoration:none}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mtile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;min-height:118px;box-shadow:var(--shadow);color:var(--ink);text-decoration:none}
.mtile:active{transform:scale(.98)}
.mtile .ic{font-size:1.6rem;line-height:1}
.mtile b{font-family:var(--serif);font-size:1.15rem}
.mtile small{color:var(--muted);font-size:.82rem;word-break:keep-all}
.pagebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding:8px 0 10px;border-bottom:2px solid var(--ink)}
.pagebar h2{font-family:var(--serif);font-size:1.3rem;margin:0;flex:none}
.pagebar .back{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;font-size:.95rem;flex:none}
.pagebar .pscope{margin-left:auto;font-size:.8rem;color:var(--muted);text-align:right;word-break:keep-all}
.label{font-size:.75rem;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.9rem;min-height:38px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.alt[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1b1b1b}
.chip.ok{border-color:var(--green)}
#chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{display:none}
#chips .chip{flex:none;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-width:100%}
.seg button{border:0;background:var(--card);padding:9px 12px;min-height:42px;font-size:.92rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 16px;min-height:46px;font-size:.95rem;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.88rem}
.tip{font-size:.85rem;color:var(--muted);margin:0;word-break:keep-all}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.kicker{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.head h3{font-family:var(--serif);font-size:1.25rem;margin:2px 0 0;line-height:1.35;word-break:keep-all}
.stat{font-size:.85rem;color:var(--muted);margin-right:auto;font-variant-numeric:tabular-nums}
.stat b{color:var(--ink)}
.speak{border:1px solid var(--line);background:var(--card);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;font-size:.9rem;flex:none}
.note{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:.9rem;word-break:keep-all}

/* 마인드맵 (mindmap.css 색을 이 페이지 색에 맞춤) */
.mm{--mm-bg:var(--card);--mm-text:var(--ink);--mm-muted:var(--muted);--mm-neu:var(--line);--mm-soft:var(--chip);--mm-mark:var(--red);--mm-root-bg:var(--ink);--mm-root-fg:var(--paper)}
.mm .en{display:block;font-family:var(--serif);font-size:.92em;color:var(--blue);font-weight:400;margin-top:1px}
.mk{display:inline-block;border-radius:6px;cursor:pointer}
.mk.hid{min-width:4.5em;padding:0 8px;background:var(--chip);color:var(--muted);border-bottom:2px solid var(--gold);font-weight:400;letter-spacing:.04em}
.mk.hid.was{border-bottom-color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.mk.no{color:var(--red)}.mk.no .en{color:var(--red)}
.mk.ok{color:var(--green)}.mk.ok .en{color:var(--green)}
.mk.no::after{content:" ✕";font-size:.8em}.mk.ok::after{content:" ○";font-size:.8em}

/* 흐름 */
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.fstep{position:relative;display:grid;grid-template-columns:34px 1fr;gap:10px;padding-bottom:22px}
.fstep:last-child{padding-bottom:0}
.fstep::before{content:"";position:absolute;left:16px;top:34px;bottom:8px;border-left:2px solid var(--line)}
.fstep::after{content:"";position:absolute;left:11px;bottom:2px;border:6px solid transparent;border-top:8px solid var(--line);border-bottom:0}
.fstep:last-child::before,.fstep:last-child::after{display:none}
.fnum{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;z-index:1}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);min-width:0;text-align:left;width:100%}
.ftag{font-size:.78rem;font-weight:700;color:var(--red);letter-spacing:.04em}
.fko{word-break:keep-all;margin:2px 0 0}
.fen{display:flex;align-items:center;gap:8px;margin-top:6px;font-family:var(--serif);color:var(--blue);font-size:.95rem;overflow-wrap:anywhere}
.fcard.hid{border-style:dashed;color:var(--muted);background:transparent;box-shadow:none}
.fcard.next{border-color:var(--gold);border-style:solid;background:var(--card)}
.pile{display:flex;flex-direction:column;gap:8px}
.pcard{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;word-break:keep-all;box-shadow:var(--shadow)}
.pcard.bad{border-color:var(--red);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.pcard.bad{animation:none}}
.result{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:16px;text-align:center}
.result b{font-family:var(--serif);font-size:1.4rem}
select,textarea,input{font-size:max(16px,1em)}
</style>
</head>

<div class="wrap">
  <div id="home" class="panel">
    <header>
      <div class="toplinks"><a href="index.html">← 암기장</a><a href="vocab.html">단어장</a></div>
      <h1>모고 지문 암기</h1>
      <p class="sub">2026 고1 10월 모의고사 18~24번, 29~40번 · 지문 내용을 마인드맵과 흐름으로 외워요</p>

  <div class="head" id="head" hidden></div>

  <!-- 마인드맵 -->
  <section class="panel" id="p-map" hidden>
    <div class="row">
      <div class="seg" id="mapMode">
        <button data-v="view">전체 보기</button>
        <button data-v="leaf">잎 가리기</button>
        <button data-v="all">가지도 가리기</button>
      </div>
    </div>
    <div class="row">
      <button class="chip alt" id="hintBtn" aria-pressed="false">초성 힌트</button>
      <button class="chip alt" id="missBtn" aria-pressed="false">몰랐던 것만</button>
    </div>
    <div class="row" id="mapBar"></div>
    <div id="mapArea"></div>
    <div class="row" id="mapDone"></div>
    <p class="tip" id="mapTip"></p>
  </section>

  <!-- 흐름 -->
  <section class="panel" id="p-flow" hidden>
    <div class="row">
      <div class="seg" id="flowMode">
        <button data-v="step">차례로 떠올리기</button>
        <button data-v="order">순서 맞추기</button>
        <button data-v="all">전체 보기</button>
      </div>
    </div>
    <div id="flowArea" class="panel"></div>
    <p class="tip" id="flowTip"></p>
  </section>
  <div class="note" id="noteBox" hidden></div>
</div>

 {"id": "29", "type": "어법", "answer": "②", "topic": "'불멸' 생물 연구를 인간 노화에 바로 쓰기는 어렵다", "map": {"center": "'불멸' 생물 연구, 인간에게 바로 쓰긴 어렵다", "branches": [{"label": "생물학적 불멸", "items": [{"ko": "히드라와 불멸의 해파리", "en": "hydra and the immortal jellyfish"}, {"ko": "뚜렷한 노화 징후가 없음", "en": "don't exhibit obvious signs of aging"}, {"ko": "죽지 않는 게 아니라, 나이 들어도 죽을 확률이 늘지 않음", "en": "their likelihood of dying does not increase with age"}]}, {"label": "기대", "items": [{"ko": "노화학자들을 들뜨게 함", "en": "excite gerontologists"}, {"ko": "노화를 이길 단서", "en": "clues about how to defeat the aging process"}]}, {"label": "한계", "items": [{"ko": "몸 전체를 재생하는 특성", "en": "regenerate entire body parts"}, {"ko": "우리보다 나무에 더 가까움", "en": "more similar to trees than to us"}, {"ko": "인간 노화와 얼마나 관련 있을지 불분명", "en": "how relevant those findings will be"}]}, {"label": "결론", "items": [{"ko": "근본 기제라면 생물학은 보편적일 수도", "en": "fundamental mechanisms"}, {"ko": "포유류인 쥐의 발견도 인간에 옮기기 어려움", "en": "difficult to translate into humans"}, {"ko": "쓸모 있으려면 아주 오래 걸릴 수도", "en": "a very long time"}]}]}, "flow": [{"tag": "정의", "ko": "히드라와 불멸의 해파리는 노화 징후가 없어 '생물학적 불멸'이라 불린다", "en": "biologically immortal"}, {"tag": "단서", "ko": "죽지 않는다는 뜻은 아니다 — 나이 들어도 죽을 확률이 늘지 않을 뿐", "en": "This doesn't mean they don't die."}, {"tag": "기대", "ko": "노화를 이길 단서를 줄 수 있어 노화학자들이 들뜬다", "en": "excite gerontologists"}, {"tag": "반전", "ko": "하지만 몸을 통째로 재생하는 특성은 우리보다 나무에 가깝다", "en": "more similar to trees than to us"}, {"tag": "의문", "ko": "그 발견이 인간 노화와 관련 있을지 불분명하다 — 쥐 연구도 옮기기 어렵다", "en": "difficult to translate into humans"}, {"tag": "결론", "ko": "히드라·해파리 연구가 우리에게 쓸모 있으려면 아주 오래 걸릴 수 있다", "en": "It may be a very long time before ..."}], "summary": "히드라와 불멸의 해파리는 노화 연구에 단서를 줄 수 있지만, 재생 능력 때문에 사람과 너무 달라서 그 발견을 인간 노화에 적용하기까지는 오래 걸릴 수 있다.", "note": "어법 ② making → makes: 주어가 their property(단수)이고 문장에 동사가 없으므로 동사 makes가 와야 한다."},
 {"id": "30", "type": "어휘", "answer": "③", "topic": "보조금의 숨은 비용", "map": {"center": "보조금의 숨은 비용", "branches": [{"label": "세 가지 수단", "items": [{"ko": "보조금·세금·규제", "en": "Subsidies, taxes, and regulations"}, {"ko": "석탄에서 벗어나 오염을 줄이게 함", "en": "switching away from coal"}, {"ko": "전환하면 이윤이 더 높을 수도", "en": "profits can be higher"}]}, {"label": "발전소의 선호", "items": [{"ko": "규제나 세금보다 보조금을 선호", "en": "prefer subsidies over regulations or taxes"}, {"ko": "스스로 비용을 내느니 정부 돈을 받음", "en": "receive money from the government"}]}, {"label": "문제 1: 다른 사람의 부담", "items": [{"ko": "기회 집합의 '확대'는 다른 이의 축소와 짝", "en": "the contraction of the opportunity set of others"}, {"ko": "일반 개인을 희생해서", "en": "at the expense of the ordinary individual"}, {"ko": "보조금을 대려고 세금이 늘어남", "en": "increased taxation"}]}, {"label": "문제 2: 효율", "items": [{"ko": "보조금은 경제를 왜곡함", "en": "distorts the economy"}, {"ko": "전기 회사가 비용 전부를 부담하지 않음", "en": "not facing the full costs"}, {"ko": "전기 값↓ 소비↑ → 온난화 악화", "en": "worsen global warming"}]}]}, "flow": [{"tag": "도입", "ko": "보조금·세금·규제 모두 발전소가 석탄에서 벗어나 오염을 줄이게 할 수 있다", "en": "switching away from coal"}, {"tag": "선호", "ko": "발전소는 그중 보조금을 좋아한다 — 비용을 내느니 돈을 받으니까", "en": "The reason is obvious."}, {"tag": "문제 1", "ko": "그들의 기회 확대는 다른 사람들의 기회 축소와 짝을 이룬다", "en": "has to be matched by the contraction"}, {"tag": "구체", "ko": "전기 회사의 '자유'는 세금을 더 내는 일반 개인을 희생해 늘어난다", "en": "at the expense of the ordinary individual"}, {"tag": "문제 2", "ko": "효율 면에서도 보조금은 경제를 왜곡한다", "en": "Moreover, ... the subsidy distorts the economy"}, {"tag": "결과", "ko": "전기 값이 낮아져 소비가 늘고 지구 온난화가 악화된다", "en": "which will worsen global warming"}], "summary": "발전소는 보조금을 좋아하지만, 보조금은 세금을 내는 일반 개인의 부담으로 주어지고, 전기 값을 낮춰 소비를 늘리므로 온난화를 악화시킬 수 있다.", "note": "어휘 ③ decreased → increased: 전기 회사의 '자유'는 일반 개인을 희생해서(at the expense of) '늘어나는' 것이다."},

 {"id": "32", "type": "빈칸 추론", "answer": "② demonstrate that they listened", "topic": "들어 준다고 느끼게 하려면 들었음을 보여 줘야 한다", "map": {"center": "'들어 준다'고 느끼게 하려면: 들었음을 보여 줘라", "branches": [{"label": "사람들의 바람", "items": [{"ko": "누구나 자기 말이 들린다고 느끼고 싶음", "en": "want to feel heard"}, {"ko": "마음에 걸리는 일이 있어 찾아옴", "en": "something on their mind"}, {"ko": "걱정을 듣고 해결해 주길 바람", "en": "listening to their concerns and going to address them"}]}, {"label": "세 가지 조건", "items": [{"ko": "① 상대가 주의를 기울였다고 느낌", "en": "paid attention to what they said"}, {"ko": "② 상대가 이해했다고 느낌", "en": "understood what they said"}, {"ko": "③ 상대가 들었음을 보여 줌 (빈칸)", "en": "demonstrate that they listened"}]}, {"label": "③이 핵심인 이유", "items": [{"ko": "이 마지막이 핵심", "en": "This last part is key."}, {"ko": "아무 반응이 없는 상대를 상상", "en": "provided no response"}, {"ko": "겉으로 드러나는 신호가 없으면", "en": "outward signal"}, {"ko": "실제로 들었는지 알 수 없음", "en": "whether or not they actually did"}]}]}, "flow": [{"tag": "주장", "ko": "사람은 누구나 자기 말이 들린다고 느끼고 싶어 한다", "en": "want to feel heard"}, {"tag": "예", "ko": "고객 센터에 전화하거나 사무실에 찾아올 때, 걱정을 듣고 해결해 주길 바란다", "en": "listening to their concerns"}, {"tag": "조건", "ko": "그러려면 세 가지가 필요하다 — 주의, 이해, 그리고 들었음을 보여 주기", "en": "three things have to happen"}, {"tag": "강조", "ko": "그중 마지막(보여 주기)이 핵심이다", "en": "This last part is key."}, {"tag": "이유", "ko": "다 듣고 이해했어도 겉으로 신호가 없으면 들었는지 알 수 없다", "en": "without some sort of outward signal"}], "summary": "상대가 들어 준다고 느끼려면 주의와 이해만으로는 부족하고, 들었다는 것을 겉으로 보여 주는 반응이 있어야 한다."},
 {"id": "33", "type": "빈칸 추론", "answer": "⑤ challenges the idea of place as passive backdrop", "topic": "장소는 수동적 배경이 아니라 경험의 매체다", "map": {"center": "장소 = 수동적 배경이 아닌 경험의 매체", "branches": [{"label": "경험과 공간", "items": [{"ko": "모든 경험은 물리적 공간에서 '일어난다'", "en": "take place"}, {"ko": "공간은 거기서 일어난 사건과 분리할 수 없음", "en": "inseparable from"}, {"ko": "공간·장소·경험의 뒤얽힘", "en": "intertwining"}]}, {"label": "핵심 (빈칸)", "items": [{"ko": "장소가 수동적 배경이라는 생각에 이의를 제기함", "en": "challenges the idea of place as passive backdrop"}]}, {"label": "필자의 결론", "items": [{"ko": "공간적 틀 = 모든 경험의 매체", "en": "the spatial framework is the medium of all experiences"}, {"ko": "경험 바깥의 배경·맥락이 아님", "en": "exterior to experience"}, {"ko": "흔히 생각하는 것과 달리", "en": "as commonly supposed"}]}, {"label": "Poulet의 말", "items": [{"ko": "벨기에의 문학 비평가", "en": "literary critic"}, {"ko": "존재는 장소를 옷처럼 두름", "en": "wraps oneself up in a garment"}, {"ko": "변장이자 성격 묘사인 옷", "en": "a disguise and a characterization"}, {"ko": "장소가 없으면 추상일 뿐", "en": "only abstractions"}]}]}, "flow": [{"tag": "전제", "ko": "모든 경험은 물리적 공간에서 '일어나므로' 공간은 그 사건과 분리할 수 없다", "en": "inseparable from"}, {"tag": "주장", "ko": "이 뒤얽힘은 '장소 = 수동적 배경'이라는 생각에 이의를 제기한다 (빈칸)", "en": "challenges the idea of place as passive backdrop"}, {"tag": "전개", "ko": "장소가 경험의 중심이라면, 공간적 틀은 모든 경험의 매체다", "en": "the medium of all experiences"}, {"tag": "대조", "ko": "흔히 생각하듯 경험 바깥에 있는 배경이나 맥락이 아니다", "en": "not merely a background or context"}, {"tag": "인용", "ko": "Poulet — 존재는 장소를 옷처럼 두르며, 장소가 없으면 추상일 뿐이다", "en": "Without places, beings would be only abstractions."}], "summary": "경험은 언제나 어떤 장소에서 일어나므로 장소는 경험과 떼어 낼 수 없다. 따라서 장소는 그저 뒤에 깔린 배경이 아니라 경험을 이루는 매체다."},
 {"id": "34", "type": "빈칸 추론", "answer": "⑤ without a complete accounting of what's happening at all other levels", "topic": "모든 모델은 '주어진 것'을 가정한다", "map": {"center": "모든 모델은 '주어진 것'을 가정한다", "branches": [{"label": "주장", "items": [{"ko": "어떤 진화 체계를 정하든 (예: 휴대 전화)", "en": "evolutionary system of interest"}, {"ko": "그냥 주어진 것으로 받아들여야 하는 것이 있음", "en": "take as a given"}, {"ko": "모든 모델은 단순화 가정을 함", "en": "simplifying assumptions"}]}, {"label": "예 1: 진화론", "items": [{"ko": "Wallace와 Darwin의 말로 된 모델", "en": "verbal model of biological evolution"}, {"ko": "변이 생성과 유전의 원리를 거의 몰랐음", "en": "variation generation and inheritance"}, {"ko": "어떻게든 일어난다고 받아들임", "en": "happened somehow"}]}, {"label": "예 2: 물리학", "items": [{"ko": "가장 세밀한 수준에서도 가정이 필요", "en": "at the finest level of detail"}, {"ko": "기본 입자의 질량과 전하", "en": "the mass and charge of fundamental particles"}, {"ko": "측정값을 받아들이고 넘어감", "en": "accept the measured values and move on"}]}, {"label": "핵심 (빈칸)", "items": [{"ko": "한 분석 수준에서 유용한 모델을 만들 수 있음", "en": "at one level of analysis"}, {"ko": "다른 모든 수준을 완전히 설명하지 않아도", "en": "without a complete accounting"}]}]}, "flow": [{"tag": "주장", "ko": "어떤 체계를 모델로 삼든, 그냥 주어진 것으로 받아들여야 하는 것이 있다", "en": "take as a given"}, {"tag": "일반화", "ko": "모든 모델은 이런 단순화 가정을 한다", "en": "Indeed, all models must make simplifying assumptions"}, {"tag": "예 1", "ko": "Wallace와 Darwin은 변이와 유전의 원리를 모른 채 진화 모델을 내놓았다", "en": "They just took as a given that ..."}, {"tag": "예 2", "ko": "물리학자도 입자의 질량과 전하를 측정값 그대로 받아들인다", "en": "Physicists, for example, ..."}, {"tag": "결론", "ko": "다른 수준을 다 설명하지 않아도 한 수준에서 유용한 모델을 만들 수 있다 (빈칸)", "en": "The key point is that ..."}], "summary": "모든 모델은 설명하지 않고 받아들이는 가정을 가진다. 다윈도 물리학자도 그랬다. 다른 수준의 일을 전부 설명하지 못해도 한 수준에서 쓸모 있는 모델을 만들 수 있다."},
 {"id": "35", "type": "무관한 문장", "answer": "③", "topic": "번아웃은 개인 문제가 아니라 구조적 문제다", "map": {"center": "번아웃 = 개인이 아닌 구조의 문제", "branches": [{"label": "계기", "items": [{"ko": "2019년 WHO가 번아웃을 직업 현상으로 인정", "en": "an occupational phenomenon"}, {"ko": "직장 정신 건강 담론의 중요한 순간", "en": "the discourse on workplace mental health"}]}, {"label": "무엇이 바뀌나", "items": [{"ko": "임상 평가와 조직의 책임을 재구성", "en": "reframes clinical assessment and organizational responsibility"}, {"ko": "구조적·체계적 예방으로 관심을 옮김", "en": "systemic prevention"}]}, {"label": "실천", "items": [{"ko": "고용주는 구조적 개입을 채택", "en": "adopt structural interventions"}, {"ko": "개인 수준의 처방에만 의존하지 않기", "en": "relying solely on individual-level remedies"}, {"ko": "임상의는 산업 보건·리더십과 협력해 근본 원인을 다룸", "en": "address root causes"}]}, {"label": "관점 전환", "items": [{"ko": "개인의 실패나 회복 탄력성 문제로 보지 않음", "en": "a personal failing"}, {"ko": "조직 문화에 뿌리내린 구조적 문제", "en": "rooted in organizational culture"}, {"ko": "부담을 개인에게만 지우지 않기", "en": "placing the burden solely on individuals"}]}]}, "flow": [{"tag": "계기", "ko": "2019년 WHO가 번아웃을 직업 현상으로 인정했다", "en": "an occupational phenomenon"}, {"tag": "의미", "ko": "이 지정은 책임을 재구성해 구조적·체계적 예방으로 관심을 돌린다", "en": "This designation reframes ..."}, {"tag": "고용주", "ko": "개인 처방에만 기대지 말고 구조적 개입을 하라", "en": "rather than relying solely on individual-level remedies"}, {"tag": "임상의", "ko": "산업 보건·리더십과 협력해 근본 원인을 다뤄라", "en": "In practice, ... address root causes"}, {"tag": "전환", "ko": "번아웃을 개인의 실패가 아니라 조직 문화에 뿌리내린 구조적 문제로 본다", "en": "a shift away from viewing burnout as a personal failing"}, {"tag": "결론", "ko": "이 재구성은 개인에게만 부담을 지우지 않고 체계적 개입과 정책 변화의 문을 연다", "en": "This reframing is essential"}], "summary": "WHO가 번아웃을 직업 현상으로 인정하면서, 번아웃은 개인이 견뎌야 할 문제가 아니라 조직과 사회 구조가 해결해야 할 문제로 보게 되었다.", "note": "무관한 문장 ③: 개인이 습관을 바꿔 스스로 회복할 수 있다는 내용이라, '개인이 아닌 구조의 문제'라는 글의 흐름과 반대다."},

<script src="mindmap.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let DATA = [];
try { DATA = JSON.parse($("mogo-data").textContent); } catch (e) { console.error("mogo-data JSON 오류", e); }
const plabel = p => p.label || p.id + "번";

/* ---------- 저장 ---------- */
const KEY = "mogo_oct26_study_v1";
let store = { miss: {}, done: {}, best: {}, cur: null, mapMode: "leaf", flowMode: "step", hint: false };
try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && typeof v === "object") store = Object.assign(store, v); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
if (!DATA.some(p => p.id === store.cur)) store.cur = DATA.length ? DATA[0].id : null;
const cur = () => DATA.find(p => p.id === store.cur);

function speak(text) {
  try { const u = new SpeechSynthesisUtterance(String(text).replace(/\.\.\./g, " ")); u.lang = "en-US"; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const chosung = w => [...w].map(ch => { const c = ch.charCodeAt(0) - 0xAC00; return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : ch; }).join("");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- 홈(메뉴) ↔ 페이지 ---------- */
const PAGES = { map: "마인드맵", flow: "흐름" };
let tab = "home", fromHome = false;
function render(t) {
  if (!PAGES[t]) t = "home";
  tab = t;
  $("home").hidden = t !== "home";
  ["pagebar", "pick", "head"].forEach(id => $(id).hidden = t === "home");
  Object.keys(PAGES).forEach(k => $("p-" + k).hidden = k !== t);
  if (t === "home") { renderHome(); $("noteBox").hidden = true; } else { $("pageTitle").textContent = PAGES[t]; renderPage(); }
  window.scrollTo(0, 0);
}
function showTab(t) {
  if (tab === "home" && t !== "home") fromHome = true;
  if (location.hash.slice(1) !== (t === "home" ? "" : t)) history.pushState(null, "", t === "home" ? location.pathname : "#" + t);
  render(t);
}
const fromUrl = () => { const t = location.hash.slice(1); if (t !== tab && !(t === "" && tab === "home")) render(t); };
window.addEventListener("hashchange", fromUrl);
window.addEventListener("popstate", fromUrl);
window.addEventListener("pageshow", fromUrl);
document.querySelectorAll(".mtile[data-t]").forEach(t => t.addEventListener("click", e => { e.preventDefault(); showTab(t.dataset.t); }));
$("backBtn").onclick = () => {
  if (fromHome) { fromHome = false; history.back(); }
  else { history.replaceState(null, "", location.pathname); render("home"); }
};
function renderHome() {
  const real = DATA.filter(p => !p.sample), sample = DATA.filter(p => p.sample);
  $("homeNote").innerHTML = real.length
    ? `들어 있는 지문: <b>${real.map(p => esc(plabel(p))).join(", ")}</b>`
    : `아직 모고 지문이 들어 있지 않아요. 시험지 사진을 보내 주시면 지문을 확인해서 넣을게요.` + (sample.length ? ` 지금은 모양을 볼 수 있게 <b>${sample.map(p => esc(plabel(p))).join(", ")}</b>가 들어 있어요.` : "");
}

/* ---------- 공통: 지문 칩 + 머리 ---------- */
function renderPage() {
  const p = cur();
  $("chips").innerHTML = DATA.map(x => {
    const d = store.done[x.id + ":" + tab];
    return `<button class="chip${d ? " ok" : ""}" data-id="${esc(x.id)}" aria-pressed="${x.id === store.cur}">${d ? "✓ " : ""}${esc(plabel(x))}</button>`;
  }).join("");
  const on = $("chips").querySelector('[aria-pressed="true"]'); if (on) $("chips").scrollLeft = on.offsetLeft - $("chips").offsetLeft - 60;
  $("pageScope").textContent = `${DATA.filter(x => store.done[x.id + ":" + tab]).length} / ${DATA.length} 외움`;
  if (!p) { $("head").innerHTML = ""; $("mapArea").innerHTML = $("flowArea").innerHTML = `<div class="empty">지문 데이터가 없어요.</div>`; return; }
  $("head").innerHTML = `<div class="kicker">${esc(plabel(p))} · ${esc(p.type || "")}${p.answer ? " · 정답 " + esc(p.answer) : ""}</div><h3>${esc(p.topic || "")}</h3>`;
  if (tab === "map") renderMap(); else renderFlow();
  showNote();
}
// 풀이 메모(어법 정답 이유, 순서 단서 등)는 답이 다 보이는 '전체 보기'에서만
function showNote() {
  const p = cur(), on = p && p.note && tab !== "home" && (tab === "map" ? store.mapMode === "view" && !missOnly : store.flowMode === "all");
  $("noteBox").hidden = !on;
  if (on) $("noteBox").innerHTML = `<b>풀이 메모</b> ${esc(p.note)}`;
}
$("chips").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  store.cur = b.dataset.id; save(); mst = {}; flowReset(); renderPage();
};
function seg(id, key, after) {
  const el = $(id);
  const paint = () => el.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === store[key]));
  el.querySelectorAll("button").forEach(b => b.onclick = () => { store[key] = b.dataset.v; save(); paint(); after(); });
  paint();
}
function doneBtn(kind) {
  const k = store.cur + ":" + kind, d = !!store.done[k];
  return `<button class="btn sm ${d ? "" : "ghost"}" data-done="${kind}">${d ? "✓ 다 외웠어요" : "다 외웠으면 체크"}</button>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-done]"); if (!b) return;
  const k = store.cur + ":" + b.dataset.done; store.done[k] = !store.done[k]; save(); renderPage();
});

/* ---------- 마인드맵 ---------- */
// 가린 노드: 탭 → 보임(shown) → 한 번 더 → 몰랐음(no, 기록) → 한 번 더 → 알았음(ok, 기록 지움)
let mst = {}, missOnly = false;
const mm = MindMap($("mapArea"), {});
const missSet = () => new Set(store.miss[store.cur] || []);
function masked(key, isBranch) {
  if (missOnly) return missSet().has(key);
  return store.mapMode === "all" || (store.mapMode === "leaf" && !isBranch);
}
function labelHtml(key, ko, en, isBranch) {
  const full = esc(ko) + (en ? `<span class="en">${esc(en)}</span>` : "");
  const st = mst[key];
  if (!masked(key, isBranch)) return full;
  if (!st) return `<span class="mk hid${missSet().has(key) ? " was" : ""}" data-k="${key}">${store.hint ? esc(chosung(ko)) : "?"}</span>`;
  return `<span class="mk ${st}" data-k="${key}">${full}</span>`;
}
function mapTree(p) {
  const miss = missSet();
  let branches = p.map.branches.map((b, i) => ({ b, i, items: b.items.map((it, j) => ({ it, j, key: `b${i}l${j}` })) }));
  if (missOnly) branches = branches.map(x => ({ ...x, items: x.items.filter(y => miss.has(y.key)) })).filter(x => x.items.length || miss.has("b" + x.i));
  return {
    id: "r", tag: plabel(p), label: p.map.center,
    children: branches.map(x => ({
      id: "b" + x.i, html: labelHtml("b" + x.i, x.b.label, "", true), count: String(x.items.length),
      children: x.items.map(y => ({ id: y.key, cls: "sm", html: labelHtml(y.key, y.it.ko, y.it.en, false) }))
    }))
  };
}
function renderMap() {
  const p = cur(); if (!p) return;
  $("hintBtn").setAttribute("aria-pressed", !!store.hint);
  $("missBtn").setAttribute("aria-pressed", missOnly);
  const tree = mapTree(p);
  if (missOnly && !tree.children.length) { $("mapArea").innerHTML = `<div class="empty">몰랐던 것이 없어요 🎉</div>`; mapBar(); return; }
  mm.render(tree, null, 2);
  mapBar();
  $("mapTip").innerHTML = store.mapMode === "view" && !missOnly
    ? "가운데 주제에서 가지, 잎 순서로 읽어요. 가지를 누르면 접혀요. 다 읽었으면 <b>잎 가리기</b>로 떠올려 보세요."
    : "가린 칸을 누르면 답이 보여요. <b>한 번 더 누르면 몰랐음(✕)</b>, 또 누르면 알았음(○)으로 바뀌어요. 몰랐던 칸은 다음에도 빨간 테두리로 나오고 <b>몰랐던 것만</b>으로 모아 볼 수 있어요.";
}
function mapBar() {
  const hid = document.querySelectorAll("#mapArea .mk.hid").length, all = document.querySelectorAll("#mapArea .mk").length;
  const miss = missSet().size, any = store.mapMode !== "view" || missOnly;
  $("mapBar").innerHTML = (any ? `<span class="stat">가린 칸 <b>${all}</b> · 남은 것 <b>${hid}</b> · 몰랐음 <b style="color:var(--red)">${miss}</b></span><button class="btn sm ghost" id="reMask">다시 가리기</button>`
    : `<span class="stat">몰랐음 <b style="color:var(--red)">${miss}</b></span>`);
  $("mapDone").innerHTML = doneBtn("map");
  if ($("reMask")) $("reMask").onclick = () => { mst = {}; renderMap(); };
}
// 부품의 접기/펴기보다 먼저 받아서, 가린 칸을 눌렀을 때는 답만 보여 줌
$("mapArea").addEventListener("click", e => {
  const m = e.target.closest(".mk"); if (!m) return;
  e.stopPropagation(); e.preventDefault();
  const k = m.dataset.k, st = mst[k], next = !st ? "shown" : st === "no" ? "ok" : "no";
  mst[k] = next;
  const set = missSet();
  if (next === "no") set.add(k); if (next === "ok") set.delete(k);
  if (set.size) store.miss[store.cur] = [...set]; else delete store.miss[store.cur];
  save(); renderMap();
}, true);
seg("mapMode", "mapMode", () => { mst = {}; missOnly = false; renderMap(); showNote(); });
$("hintBtn").onclick = () => { store.hint = !store.hint; save(); renderMap(); };
$("missBtn").onclick = () => { missOnly = !missOnly; mst = {}; renderMap(); showNote(); };

/* ---------- 흐름 ---------- */
let fShown = 1, fPile = [], fDoneN = 0, fWrong = 0;
function flowReset() { fShown = 1; fPile = []; fDoneN = 0; fWrong = 0; }
function stepHtml(s, i, opt) {
  opt = opt || {};
  const inner = opt.hid
    ? `<button class="fcard hid${opt.next ? " next" : ""}" data-reveal="${i}">${opt.next ? "떠올려 보고 누르기 — 다음 단계는?" : "…"}</button>`
    : `<div class="fcard"><div class="ftag">${esc(s.tag || "")}</div><p class="fko">${esc(s.ko)}</p>${s.en ? `<div class="fen"><span>${esc(s.en)}</span><button class="speak" data-say="${esc(s.en)}" aria-label="듣기">🔊</button></div>` : ""}</div>`;
  return `<li class="fstep"><span class="fnum">${i + 1}</span>${inner}</li>`;
}
function renderFlow() {
  const p = cur(); if (!p) return;
  const F = p.flow || [], area = $("flowArea"), mode = store.flowMode;
  if (mode === "all") {
    area.innerHTML = `<ol class="flow">${F.map((s, i) => stepHtml(s, i)).join("")}</ol>` +
      (p.summary ? `<div class="note"><b>요약</b> ${esc(p.summary)}</div>` : "") + `<div class="row">${doneBtn("flow")}</div>`;
    $("flowTip").textContent = "글이 흘러가는 순서예요. 단계 이름(도입·이유·결과 …)과 함께 통째로 읽어 보세요.";
  } else if (mode === "step") {
    fShown = Math.min(Math.max(fShown, 1), F.length);
    area.innerHTML = `<div class="row"><span class="stat">단계 <b>${fShown}</b> / ${F.length}</span><button class="btn sm ghost" id="fAgain">처음부터</button>${doneBtn("flow")}</div>` +
      `<ol class="flow">${F.map((s, i) => stepHtml(s, i, { hid: i >= fShown, next: i === fShown })).join("")}</ol>`;
    $("fAgain").onclick = () => { fShown = 1; renderFlow(); };
    $("flowTip").textContent = "첫 단계만 보여요. 다음에 어떤 내용이 오는지 먼저 떠올린 뒤, 노란 테두리 칸을 눌러 확인하세요.";
  } else {
    if (!fPile.length && fDoneN < F.length) { fPile = shuffle(F.map((s, i) => i)); if (F.length > 1 && fPile.every((v, i) => v === i)) fPile.reverse(); }
    const finished = fDoneN >= F.length;
    if (finished) { const b = store.best[p.id]; if (b == null || fWrong < b) { store.best[p.id] = fWrong; save(); } }
    area.innerHTML = `<div class="row"><span class="stat">맞춘 단계 <b>${fDoneN}</b> / ${F.length} · 틀린 횟수 <b style="color:var(--red)">${fWrong}</b>${store.best[p.id] != null ? ` · 최고 기록 ${store.best[p.id]}번` : ""}</span><button class="btn sm ghost" id="fAgain">다시 섞기</button></div>` +
      (fDoneN ? `<ol class="flow">${F.slice(0, fDoneN).map((s, i) => stepHtml(s, i)).join("")}</ol>` : "") +
      (finished ? `<div class="result"><b>${fWrong ? `틀린 횟수 ${fWrong}번` : "한 번도 안 틀렸어요 🎉"}</b><p class="tip">순서를 다 맞췄어요.</p></div><div class="row">${doneBtn("flow")}</div>`
        : `<div class="label">${fDoneN + 1}번째에 올 내용을 고르세요</div><div class="pile">${fPile.map(i => `<button class="pcard" data-pick="${i}">${esc(F[i].ko)}</button>`).join("")}</div>`);
    $("fAgain").onclick = () => { flowReset(); renderFlow(); };
    $("flowTip").textContent = "단계가 섞여 있어요. 글의 순서대로 하나씩 누르세요. 틀리면 흔들리고 횟수가 올라가요.";
  }
}
$("flowArea").addEventListener("click", e => {
  const say = e.target.closest("[data-say]"); if (say) { speak(say.dataset.say); return; }
  const rv = e.target.closest("[data-reveal]");
  if (rv) { if (+rv.dataset.reveal === fShown) { fShown++; renderFlow(); } return; }
  const pk = e.target.closest("[data-pick]"); if (!pk) return;
  const i = +pk.dataset.pick;
  if (i === fDoneN) { fDoneN++; fPile = fPile.filter(x => x !== i); renderFlow(); }
  else { fWrong++; pk.classList.remove("bad"); void pk.offsetWidth; pk.classList.add("bad"); document.querySelector("#flowArea .stat").innerHTML = document.querySelector("#flowArea .stat").innerHTML.replace(/(틀린 횟수 <b[^>]*>)\d+/, "$1" + fWrong); }
});
seg("flowMode", "flowMode", () => { flowReset(); renderFlow(); showNote(); });

render(location.hash.slice(1));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
